<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Zonas de entrenamiento · Made For Try</title>
<!--
  Made For Try · zonas.html (esquema v1)
  Página genérica: NO contiene datos de ningún atleta. Los datos viajan en el fragmento
  de la URL (zonas.html#z=<base64url sin relleno de deflate-raw del JSON UTF-8>).
  El fragmento nunca se envía al servidor: todo se decodifica en el navegador.
-->
<style>
:root{
  --bg:#0b0f14; --card:#121922; --card2:#0e141b; --ink:#eef4fb; --ink2:#9db0c4; --ink3:#6b7f94;
  --line:#1e2a37; --line2:#2a3a4c;
  --m4t:#ffd23f; --m4t2:#ffb300;
  --swim:#2bd4e6; --bike:#ffb33e; --run:#ff5d73; --good:#38d39f; --warn:#ffb33e; --bad:#ff5d73;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  font-synthesis:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 90px}
h1,h2,h3{line-height:1.15;margin:0}
a{color:var(--m4t)}
small{color:var(--ink3)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
[hidden]{display:none!important}

/* ---------- header (molde) ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(11,15,20,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 16px}
.hbar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--m4t);box-shadow:0 0 0 3px rgba(255,210,63,.18)}
.brand small{color:var(--ink2);font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:11px}
.spacer{flex:1}
.toggle{display:inline-flex;background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:3px}
.toggle button{all:unset;cursor:pointer;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink2);transition:.15s}
.toggle button.on{background:var(--m4t);color:#1a1205}
.toggle button:focus-visible{outline:2px solid var(--m4t);outline-offset:2px}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;max-width:1080px;margin-left:auto;margin-right:auto}
.nav:empty{display:none}
.nav button{all:unset;cursor:pointer;font-size:11.5px;color:var(--ink2);padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.nav button:hover{border-color:var(--m4t);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--m4t);outline-offset:1px}

/* ---------- hero (molde) ---------- */
.hero{padding:34px 0 10px}
.kicker{color:var(--m4t2);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:12px}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:850;margin:8px 0 2px;letter-spacing:-.5px}
.hero .sub{color:var(--ink2);font-size:clamp(15px,2.4vw,19px);font-weight:600}
.hero .sub b{color:var(--ink)}
.hero .meta{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:14px;color:var(--ink3);font-size:13px}
.hero .meta b{color:var(--ink);font-weight:700}

/* ---------- secciones (molde) ---------- */
section{margin-top:40px;scroll-margin-top:110px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sec-h .acto{color:var(--m4t2);font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
.sec-h h2{font-size:clamp(21px,3.4vw,28px);font-weight:820;letter-spacing:-.3px}
.lede{color:var(--ink2);font-size:15.5px;max-width:74ch;margin:0 0 16px}

/* tarjetas (molde) */
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g3,.g2{grid-template-columns:1fr}}
.span2{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);scroll-margin-top:120px}
.card.tight{padding:14px}
.card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.stat{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:15px}
.stat .lab{color:var(--ink3);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.stat .val{font-size:26px;font-weight:850;margin-top:4px;letter-spacing:-.5px}
.stat .val small{font-size:14px;color:var(--ink2);font-weight:700}
.stat .delta{font-size:12px;font-weight:700;margin-top:3px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink2)} .wrn{color:var(--warn)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line2)}
.pill.swim{color:var(--swim);border-color:rgba(43,212,230,.35)}
.pill.bike{color:var(--bike);border-color:rgba(255,179,62,.35)}
.pill.run{color:var(--run);border-color:rgba(255,93,115,.35)}

/* dos registros (molde) */
.coach-note{display:none}
body.coach .coach-note{display:block}
.athlete-note{border-left:3px solid var(--m4t);padding:2px 0 2px 13px;color:var(--ink);font-size:15px;margin:10px 0}
.coach-note{border-left:3px solid var(--line2);padding:10px 12px 10px 13px;margin:10px 0;color:var(--ink2);font-size:13.5px;background:var(--card2);border-radius:0 10px 10px 0}
.coach-note .tag{display:block;color:var(--m4t2);font-weight:800;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.coach-note .mono b,.coach-note b{color:var(--ink)}
.coach-only{display:none}
body.coach .coach-only{display:inline}
body.coach p.coach-only,body.coach div.coach-only{display:block}
body.coach th.coach-only,body.coach td.coach-only{display:table-cell}

/* tablas (molde) */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink3);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
td.mono,th.mono{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.t-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.t-scroll table th,.t-scroll table td{white-space:nowrap}
.tag-old{color:var(--ink3)} .tag-new{color:var(--good);font-weight:800}

/* gráficas (molde) */
.cap{color:var(--ink3);font-size:12px;margin-top:8px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0 2px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.ln{width:16px;height:0;border-radius:0;border-top:2px dashed var(--m4t);vertical-align:3px}
.legend i.ln.old{border-top-color:var(--ink3)}
.legend i.ring{width:11px;height:11px;border-radius:50%;border:2px solid var(--m4t);background:transparent}

.callout{border-radius:14px;padding:13px 15px;border:1px solid var(--line2);background:var(--card2);margin-top:10px}
.callout.key{border-color:rgba(255,210,63,.4);background:linear-gradient(180deg,rgba(255,210,63,.07),transparent)}
.callout h4{margin:0;font-size:14.5px;font-weight:800;color:var(--m4t);line-height:1.35}
.callout.danger{border-color:rgba(255,93,115,.4);background:linear-gradient(180deg,rgba(255,93,115,.07),transparent)}
.callout.danger h4{color:var(--run)}
.callout.warn{border-color:rgba(255,179,62,.4);background:linear-gradient(180deg,rgba(255,179,62,.07),transparent)}
.callout.warn h4{color:var(--warn)}
.callout.good{border-color:rgba(56,211,159,.4);background:linear-gradient(180deg,rgba(56,211,159,.07),transparent)}
.callout.good h4{color:var(--good)}

.badge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.badge.bw{white-space:normal;line-height:1.4;display:inline-block}
.b-ok{background:rgba(56,211,159,.14);color:var(--good)}
.b-lo{background:rgba(255,93,115,.14);color:var(--bad)}
.b-hi{background:rgba(255,179,62,.16);color:var(--warn)}
.b-off{background:var(--card2);color:var(--ink3);border:1px solid var(--line2)}

footer{margin-top:54px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer b{color:var(--ink2)}

/* ---------- zonas (nuevo, sobre el molde) ---------- */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
button.stat{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:13px 14px;transition:border-color .15s;min-width:0}
button.stat:hover{border-color:var(--line2)}
button.stat:focus-visible{outline:2px solid var(--m4t);outline-offset:2px}
.stat .lab{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.sw.swim{background:var(--swim)} .sw.bike{background:var(--bike)} .sw.run{background:var(--run)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.cnt{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--card2)}
.zc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zc-h h3{margin:0}
.thr{display:flex;align-items:baseline;gap:4px 9px;flex-wrap:wrap;margin:12px 0 2px}
.thr .o{font-size:19px;font-weight:800;color:var(--ink3)}
.thr .ar{color:var(--ink3);font-weight:800}
.thr .n{font-size:30px;font-weight:850;letter-spacing:-.6px;line-height:1}
.thr .u{color:var(--ink2);font-weight:700;font-size:13px}
.thr .delta{font-size:12.5px;font-weight:800}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.note-s{font-size:13px;color:var(--ink2);margin:6px 0 0}
.viz{margin-top:12px}
.viz svg{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;cursor:pointer}
.viz svg:focus{outline:none}
.viz svg:focus-visible{outline:2px solid var(--m4t);outline-offset:3px;border-radius:6px}
.zleg{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.zleg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--ink2);padding:3px 9px 3px 6px;border:1px solid var(--line);border-radius:999px}
.zleg button i{display:inline-block;width:10px;height:10px;border-radius:3px}
.zleg button.on{border-color:var(--ink2);color:var(--ink);background:var(--card2)}
.zleg button:focus-visible{outline:2px solid var(--m4t);outline-offset:1px}
.readout{margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--ink2);min-height:40px}
.readout b{color:var(--ink);font-weight:800}
.nw{white-space:nowrap}
.dir{display:flex;justify-content:space-between;gap:10px;color:var(--ink3);font-size:11.5px;margin-top:6px}
details.tv{margin-top:12px}
details.tv summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink2)}
details.tv[open] summary{margin-bottom:8px}
th .nu{text-transform:none;letter-spacing:0;font-weight:700}
td small{font-size:11px}
@media(max-width:520px){.t-scroll table{font-size:12.5px}.t-scroll th,.t-scroll td{padding:7px 8px}}
.ok{color:var(--good);font-weight:800} .ne{color:var(--warn);font-weight:800}
.curve-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.curve-h h3{margin:0}
.toggle.seg button{padding:5px 11px;font-size:12px}
.ci{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.ci-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ci-h b{font-size:14px}
.ci-h .delta{margin-left:auto;font-size:12.5px;font-weight:800}
.br{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2);margin-top:7px}
.br b{color:var(--ink);white-space:nowrap}
.track{height:12px;background:var(--line);border-radius:0 4px 4px 0;margin-top:3px;overflow:hidden}
.track i{display:block;height:100%;border-radius:0 4px 4px 0}
.track.hatch{background:repeating-linear-gradient(135deg,var(--line2) 0 5px,transparent 5px 11px);border-radius:4px;margin-top:10px}
.ci.inc .ci-h b{color:var(--ink2)}
.steps{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.steps{grid-template-columns:1fr}}
.step svg{display:block;margin-bottom:10px;max-width:100%}
.step p{margin:4px 0 0;color:var(--ink);font-size:14.5px}
.step .num{color:var(--m4t2);font-weight:800;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--ink);line-height:1.75}
.formula sub{font-size:.75em}
.hint{color:var(--ink2)}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <span class="brand"><span class="dot"></span>MADE FOR TRY <small>· zonas de entrenamiento</small></span>
    <span class="spacer"></span>
    <div class="toggle" id="regToggle" role="group" aria-label="Registro">
      <button type="button" class="on" data-reg="athlete" aria-pressed="true">Para el atleta</button>
      <button type="button" data-reg="coach" aria-pressed="false">Para el entrenador</button>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Secciones"></nav>
</header>

<div class="wrap">
  <main id="app">
    <div class="hero">
      <div class="kicker">Zonas de entrenamiento</div>
      <h1>Abriendo tus zonas…</h1>
      <noscript><div class="callout danger"><h4>Esta página necesita JavaScript para mostrar tus zonas.</h4></div></noscript>
    </div>
  </main>
  <footer>
    <span>Made For Try (M4T) — entrenamos con método, no con suerte.</span>
    <span class="mono" id="footMeta"></span>
  </footer>
</div>

<script>
(() => {
'use strict';

const app = document.getElementById('app');
const navEl = document.getElementById('nav');
const footMeta = document.getElementById('footMeta');

/* ---------- registro: interruptor atleta / entrenador (comportamiento del molde) ---------- */
const rt = document.getElementById('regToggle');
rt.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  [...rt.children].forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  const coach = b.dataset.reg === 'coach';
  document.body.classList.toggle('coach', coach);
  document.querySelectorAll('details.tv').forEach(d => { d.open = coach; });
});

/* ---------- utilidades ---------- */
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
const num = x => typeof x === 'number' ? x : (typeof x === 'string' && x.trim() !== '' ? Number(x) : NaN);
const isPos = x => typeof x === 'number' && isFinite(x) && x > 0;
const f1 = x => String(Math.round(x * 10) / 10);
function ymd(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m && +m[2] >= 1 && +m[2] <= 12 ? [+m[1], +m[2], +m[3]] : null; }
function fdate(s, yr) { const d = ymd(s); if (!d) return s ? String(s) : '—'; return d[2] + ' ' + MES[d[1] - 1] + (yr === false ? '' : ' ' + d[0]); }
function ndays(a, b) { const x = ymd(a), y = ymd(b); return x && y ? Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 864e5) : NaN; }
function nf(x, d) {
  d = d || 0; if (!isFinite(x)) return '—';
  const r = Math.abs(x).toFixed(d).split('.'); let i = r[0];
  if (i.length > 3) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (x < 0 && +Math.abs(x).toFixed(d) !== 0 ? '−' : '') + i + (r[1] ? ',' + r[1] : '');
}
function sgn(x, d) { if (!isFinite(x)) return '—'; const r = +x.toFixed(d || 0); return r === 0 ? nf(0, d) : (r > 0 ? '+' : '−') + nf(Math.abs(r), d); }
function mmss(sec) {
  if (!isPos(sec)) return '—';
  let t = Math.round(sec); const h = Math.floor(t / 3600); t -= h * 3600;
  const mm = Math.floor(t / 60), ss = t % 60;
  return (h ? h + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(ss).padStart(2, '0');
}
function durLab(s) {
  s = Math.round(s); if (!(s > 0)) return '—';
  if (s < 60) return s + ' s';
  if (s < 3600) { const m = Math.floor(s / 60), r = s % 60; return m + ' min' + (r ? ' ' + r + ' s' : ''); }
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h + ' h' + (m ? ' ' + m + ' min' : '');
}
const durTick = s => s < 60 ? s + ' s' : s < 3600 ? (s / 60) + '′' : (s / 3600) + ' h';

/* ---------- deportes y métricas ---------- */
const SP = {
  swim: { name: 'Natación', pill: 'NADO', acto: 'Nado', de: 'natación' },
  bike: { name: 'Ciclismo', pill: 'BICI', acto: 'Bici', de: 'ciclismo' },
  run:  { name: 'Carrera', pill: 'CARRERA', acto: 'Carrera', de: 'carrera' }
};
const SP_ORDER = ['swim', 'bike', 'run'];
const MT = { hr: { name: 'Frecuencia cardíaca', short: 'FC' }, sp: { name: 'Ritmo', short: 'Ritmo' }, pw: { name: 'Potencia', short: 'Potencia' } };
const PREF = { swim: ['sp', 'hr', 'pw'], bike: ['pw', 'hr', 'sp'], run: ['sp', 'hr', 'pw'] };
const BASE = { swim: '#2bd4e6', bike: '#ffb33e', run: '#ff5d73', old: '#9db0c4', m4t: '#ffd23f' };
const STATES = ['sube', 'baja', 'igual', 'sin_dato', 'artefacto'];
const thrName = (sp, m) => m === 'hr' ? 'LTHR' : m === 'pw' ? (sp === 'run' ? 'rFTPw' : 'FTP') : (sp === 'swim' ? 'CSS' : sp === 'run' ? 'ritmo umbral' : 'velocidad umbral');
const isPace = (sp, m) => m === 'sp' && sp !== 'bike';
const perOf = sp => sp === 'swim' ? 100 : 1000;
/* valor legible: ritmo en min/km o min/100 m (nunca m/s en el registro atleta), FC en ppm, potencia en W */
function fv(sp, m, x) {
  if (!isFinite(x)) return { v: '—', u: '' };
  if (m === 'sp') {
    if (sp === 'bike') return { v: nf(x * 3.6, 1), u: 'km/h' };
    if (!(x > 0)) return { v: '—', u: '' };
    return sp === 'swim' ? { v: mmss(100 / x), u: '/100 m' } : { v: mmss(1000 / x), u: '/km' };
  }
  return { v: nf(x), u: m === 'hr' ? 'ppm' : 'W' };
}
const fvs = (sp, m, x) => { const r = fv(sp, m, x); return r.u ? r.v + ' ' + r.u : r.v; };

/* ---------- zonas ---------- */
function cleanZ(set) {
  if (!set || !Array.isArray(set.z)) return null;
  const z = set.z.filter(p => Array.isArray(p) && p.length >= 2 && isFinite(num(p[0])) && isFinite(num(p[1]))).map(p => [num(p[0]), num(p[1])]);
  return z.length ? z : null;
}
/* la última zona suele cerrar con un centinela (255 ppm, 2000 W, velocidad imposible): se trata como abierta */

    const nm = thrName(sport, k);
    let cn = `Curva mean-max ${esc(WIN.txt)} · ${pts.length} duraciones (${esc(durLab(pts[0][0]))} → ${esc(durLab(pts[pts.length - 1][0]))}).<br>`;
    cn += p20 ? `MM20 = <b>${esc(k === 'sp' ? nf(p20[1], 2) + ' m/s (' + fvs(sport, k, p20[1]) + ')' : fvs(sport, k, p20[1]))}</b> · ${esc(fdate(p20[2]))}.` : 'Sin punto de 20′ en la ventana.';
    if (e && showNew) cn += `<br>${esc(nm)} nuevo = ${esc(rawV(e, e.tN))}${e.tP > 0 ? ' · anterior = ' + esc(rawV(e, e.tP)) + ' · k = ' + esc(nf(e.k, 4)) : ''}.`;
    else if (e && e.tP > 0) cn += `<br>${esc(nm)} vigente = ${esc(rawV(e, e.tP))} (${e.st === 'artefacto' ? 'MM20 descartado' : 'se conserva'}).`;
    let rows = '';
    pts.forEach(p => {
      rows += `<tr><td class="mono">${esc(durLab(p[0]))}</td><td class="mono"><b>${esc(fvs(sport, k, p[1]))}</b></td><td class="mono">${esc(fdate(p[2]))}</td>` +
        (k === 'sp' ? `<td class="mono coach-only">${esc(nf(p[1], 2))}</td>` : '') + '</tr>';
    });
    const tbl = `<details class="tv"><summary>Ver la curva en números</summary><div class="t-scroll"><table><tr><th>Duración</th><th>Mejor marca</th><th>Fecha</th>${k === 'sp' ? '<th class="coach-only"><span class="nu">m/s</span></th>' : ''}</tr>${rows}</table></div></details>`;
    const leg = `<div class="legend">${showNew ? '<span><i class="ln"></i>umbral nuevo</span>' : ''}${e && e.tP > 0 && !(showNew && Math.abs(e.tP - e.tN) < 1e-9) ? '<span><i class="ln old"></i>' + (showNew ? 'umbral anterior' : 'umbral vigente') + '</span>' : ''}${p20 ? '<span><i class="ring"></i>tu mejor 20′</span>' : ''}</div>`;
    blocks += `<div class="cblk" data-k="${k}"${i ? ' hidden' : ''}><div class="viz" id="v-${id}"></div><div class="readout" id="o-${id}" aria-live="polite"></div>${leg}` +
      `<div class="athlete-note">${esc(an)}</div><div class="coach-note"><span class="tag">Entrenador · curva ${esc(MT[k].short)}</span><span class="mono">${cn}</span></div>${tbl}</div>`;
  });
  return `<div class="card span2" id="curva-${sport}"><div class="curve-h"><h3>Tu curva de rendimiento · ${esc(S2(sport))}</h3>${sw}</div>${blocks}</div>`;
}
const S2 = sport => SP[sport].de;

function tile(e) {
  const showN = e.changed && e.tN > 0, v = fv(e.sport, e.met, showN ? e.tN : e.tP);
  const tpT = e.tp === 'escrito' ? ' · en TP' : e.tp === 'propuesta' ? ' · propuesta' : '';
  let d;
  if (showN && e.tP > 0) { const c = dirOf(e.pc); d = `<div class="delta ${c}">${arrOf(c)} ${c === 'flat' ? 'igual' : esc(sgn(e.pc, 1)) + '%'}${tpT}</div>`; }
  else if (showN) d = `<div class="delta flat">nuevo${tpT}</div>`;
  else if (e.st === 'artefacto') d = '<div class="delta wrn">⚠ descartado · se mantiene</div>';
  else d = '<div class="delta flat">sin dato · se mantiene</div>';
  return `<button type="button" class="stat" data-go="${e.id}"><div class="lab"><i class="sw ${e.sport}"></i>${SP[e.sport].acto} · ${MT[e.met].short}</div>` +
    `<div class="val mono">${esc(v.v)}<small> ${esc(v.u)}</small></div>${d}</button>`;
}

function cozSection(coz) {
  const items = (Array.isArray(coz.items) ? coz.items : []).filter(it => it && typeof it === 'object' && SP[it.dep] && MT[it.met] && isPos(num(it.dur)))
    .map(it => ({ dep: it.dep, met: it.met, dur: num(it.dur), val: num(it.val), prev: num(it.prev), prevDate: it.prevDate, inc: it.estado === 'incompleto', motivo: it.motivo ? String(it.motivo) : '' }))
    .sort((a, b) => SP_ORDER.indexOf(a.dep) - SP_ORDER.indexOf(b.dep) || PREF[a.dep].indexOf(a.met) - PREF[b.dep].indexOf(b.met) || a.dur - b.dur);
  if (!items.length) return '';
  const cmp = it => !it.inc && isPos(it.val) && isPos(it.prev);
  const ok = items.filter(cmp), inc = items.filter(it => it.inc);
  const best = ok.filter(it => it.met !== 'hr' && it.val > it.prev);
  let cards = '', rows = '';
  items.forEach(it => {
    const head = `<span class="pill ${it.dep}">${SP[it.dep].pill}</span><b>${MT[it.met].name} · ${esc(durLab(it.dur))}</b>`;
    if (!cmp(it)) {
      const lab = it.inc ? 'archivo incompleto: no se compara' : 'sin dato para comparar';
      cards += `<div class="ci inc"><div class="ci-h">${head}</div><span class="badge b-off bw">${lab}</span><div class="track hatch" role="img" aria-label="${lab}"></div>${it.motivo ? `<p class="note-s">Motivo: ${esc(it.motivo)}</p>` : ''}</div>`;
      rows += `<tr><td>${SP[it.dep].acto} · ${MT[it.met].short}<br><small>${esc(durLab(it.dur))}</small></td><td colspan="3" class="tag-old">${lab}${it.motivo ? '<br><small>' + esc(it.motivo) + '</small>' : ''}</td></tr>`;
      return;
    }
    const pc = (it.val / it.prev - 1) * 100, c = it.met === 'hr' ? 'flat' : dirOf(pc), ar = arrOf(dirOf(pc));
    const star = it.met !== 'hr' && it.val > it.prev ? ' ★' : '';
    const mx = Math.max(it.val, it.prev), a = fv(it.dep, it.met, it.val), b = fv(it.dep, it.met, it.prev);
    let extra = '';
    if (isPace(it.dep, it.met)) { const per = perOf(it.dep), dt = Math.round(per / it.val - per / it.prev); extra = Math.abs(dt) >= 1 ? ' · ' + Math.abs(dt) + ' s' + (it.dep === 'swim' ? '/100 m' : '/km') + (dt < 0 ? ' más rápido' : ' más lento') : ''; }
    cards += `<div class="ci"><div class="ci-h">${head}<span class="delta ${c}">${ar} ${esc(sgn(pc, 1))}%${star}</span></div>` +
      `<div class="br"><span>Cozumel</span><b>${esc(a.v)} ${esc(a.u)}</b></div><div class="track" role="img" aria-label="Cozumel ${esc(a.v + ' ' + a.u)}"><i style="width:${(it.val / mx * 100).toFixed(1)}%;background:var(--${it.dep})"></i></div>` +
      `<div class="br"><span>Mejor previo · ${esc(fdate(it.prevDate, false))}</span><b>${esc(b.v)} ${esc(b.u)}</b></div><div class="track" role="img" aria-label="Mejor previo ${esc(b.v + ' ' + b.u)}"><i style="width:${(it.prev / mx * 100).toFixed(1)}%;background:#86919c"></i></div>` +
      (star ? '<p class="note-s">★ Nueva mejor marca en esta duración.</p>' : extra ? `<p class="note-s">${esc(extra.slice(3))}</p>` : '') + '</div>';
    const msv = x => it.met === 'sp' ? '<br><small>' + esc(nf(x, 2)) + ' m/s</small>' : '';
    rows += `<tr><td>${SP[it.dep].acto} · ${MT[it.met].short}<br><small>${esc(durLab(it.dur))}</small></td>` +
      `<td class="mono"><b>${esc(fvs(it.dep, it.met, it.val))}</b>${msv(it.val)}</td>` +
      `<td class="mono">${esc(fvs(it.dep, it.met, it.prev))}${msv(it.prev)}<br><small>${esc(fdate(it.prevDate))}</small></td>` +
      `<td class="mono">${esc(sgn(pc, 2))}%<br><small>×${esc(nf(it.val / it.prev, 3))}</small></td></tr>`;
  });
  let an = `De ${items.length} comparaciones, ${ok.length} se pueden leer`;
  an += best.length ? `. En ${best.length} superaste tu mejor marca previa ★.` : '.';
  an += ' En un Ironman se va con el freno de mano puesto a propósito: aquí ves cuánto de tu mejor historia llevaste a cada hora.';
  const cn = `Comparación: valor en carrera vs mejor marca previa a la carrera en la misma duración (mean-max). Δ% = carrera / previo − 1. ` +
    `Los ítems «incompleto» (${inc.length}) no se comparan.` +
    `<div class="t-scroll" style="margin-top:8px"><table><tr><th>Ítem</th><th>Cozumel</th><th>Mejor previo</th><th>Δ</th></tr>${rows}</table></div>`;
  return `<section id="coz"><div class="sec-h"><span class="acto">Cozumel</span><h2>Tu Ironman Cozumel frente a tu historia</h2></div>` +
    `<p class="lede"><b style="color:var(--ink)">${esc(coz.race || 'IRONMAN Cozumel')}</b> · lo que hiciste el día de la carrera, junto a tu mejor marca de los meses anteriores en la misma duración.</p>` +
    `<div class="grid g3">${cards}</div><div class="athlete-note" style="margin-top:14px">${esc(an)}</div>` +
    `<div class="coach-note"><span class="tag">Entrenador · comparación de carrera</span><span class="mono">${cn}</span></div></section>`;
}

function methodSection() {
  const r = ramp('m4t', 5), o = ramp('old', 5);
  const ta = [8, 36, 62, 86, 108, 132], tb = [8, 41, 69, 95, 117, 132];
  let rib = '';
  for (let i = 0; i < 5; i++) {
    rib += `<rect x="${ta[i] + (i ? 1 : 0)}" y="8" width="${ta[i + 1] - ta[i] - (i ? 1 : 0) - (i < 4 ? 1 : 0)}" height="13" rx="3" fill="${o[i].c}"/>`;
    rib += `<rect x="${tb[i] + (i ? 1 : 0)}" y="43" width="${tb[i + 1] - tb[i] - (i ? 1 : 0) - (i < 4 ? 1 : 0)}" height="13" rx="3" fill="${r[i].c}"/>`;
    if (i) rib += `<line x1="${ta[i]}" y1="22" x2="${tb[i]}" y2="42" stroke="#3a4d63"/>`;
  }
  const svg1 = '<svg width="140" height="64" viewBox="0 0 140 64" aria-hidden="true"><line x1="8" y1="58" x2="132" y2="58" stroke="#1e2a37"/><path d="M8 8 C 30 12, 52 28, 82 34 S 120 48, 132 52" fill="none" stroke="#9db0c4" stroke-width="2"/><line x1="82" y1="4" x2="82" y2="26" stroke="#ffd23f" stroke-dasharray="3 3"/><circle cx="82" cy="34" r="7" fill="none" stroke="#ffd23f" stroke-width="2"/><circle cx="82" cy="34" r="3" fill="#ffd23f"/></svg>';
  const svg2 = '<svg width="140" height="64" viewBox="0 0 140 64" aria-hidden="true"><path d="M22 58 A48 48 0 0 1 118 58" fill="none" stroke="#1e2a37" stroke-width="9" stroke-linecap="round"/><path d="M22 58 A48 48 0 0 1 98 21" fill="none" stroke="#ffd23f" stroke-width="9" stroke-linecap="round"/><line x1="70" y1="58" x2="96" y2="25" stroke="#eef4fb" stroke-width="3" stroke-linecap="round"/><circle cx="70" cy="58" r="5" fill="#eef4fb"/></svg>';
  const svg3 = `<svg width="140" height="64" viewBox="0 0 140 64" aria-hidden="true">${rib}</svg>`;
  return `<section id="metodo"><div class="sec-h"><span class="acto">Método</span><h2>Cómo se calculan tus zonas</h2></div>` +
    `<div class="steps">` +
    `<div class="card tight step">${svg1}<div class="num">Paso 1</div><p>Buscamos tu mejor bloque de 20 minutos de los últimos 90 días.</p></div>` +
    `<div class="card tight step">${svg2}<div class="num">Paso 2</div><p>Ese promedio es tu nuevo umbral: el esfuerzo más alto que sostienes sin quemarte.</p></div>` +
    `<div class="card tight step">${svg3}<div class="num">Paso 3</div><p>Todas tus zonas se mueven en la misma proporción. Sin dato no se inventa nada: se quedan como estaban.</p></div>` +
    `</div><div class="coach-note"><span class="tag">Entrenador · fórmula</span><div class="formula">` +
    `umbral<sub>nuevo</sub> = media del mejor bloque de 20′ (crudo) en la ventana ${esc(WIN.txt)}<br>` +
    `k = umbral<sub>nuevo</sub> / umbral<sub>anterior</sub><br>` +
    `frontera<sub>i,nueva</sub> = frontera<sub>i,anterior</sub> × k (el esquema conserva sus proporciones)<br>` +
    `ritmo: k se aplica a la velocidad (m/s) · carrera min/km = 1000 / v · natación min/100 m = 100 / v<br>` +
    `sin dato: no hay MM20 válido en la ventana → se conservan las zonas · artefacto: valor de sensor/GPS → se descarta<br>` +
    `TrainingPeaks: «escrito» = ya cargado · «propuesta» = pendiente de visto bueno` +
    `</div></div></section>`;
}

/* ---------- render principal ---------- */
function render(D) {
  PENDING = []; CHARTS.length = 0;
  const name = String(D.n || 'Atleta');
  document.title = 'Zonas · ' + name + ' · Made For Try';
  const w = Array.isArray(D.w) ? D.w : [];
  if (ymd(w[0]) && ymd(w[1])) {
    const sameY = ymd(w[0])[0] === ymd(w[1])[0], nd = ndays(w[0], w[1]) + 1;
    WIN = { txt: fdate(w[0], !sameY) + ' → ' + fdate(w[1]) + ' (' + nd + ' d)', short: nd + ' días' };
  } else WIN = { txt: 'últimos 90 días', short: '90 días' };
  const sports = SP_ORDER.filter(s => D.d[s] && typeof D.d[s] === 'object');
  const entries = [];
  sports.forEach(s => { const m = D.d[s].m && typeof D.d[s].m === 'object' ? D.d[s].m : {}; PREF[s].forEach(k => { if (m[k] && typeof m[k] === 'object') entries.push(norm(s, k, m[k])); }); });
  const ch = entries.filter(e => e.changed && e.tP > 0 && e.tN > 0);
  const ups = ch.filter(e => dirOf(e.pc) === 'up').length, downs = ch.filter(e => dirOf(e.pc) === 'down').length;
  const same = entries.filter(e => (e.changed && dirOf(e.pc) === 'flat') || e.st === 'sin_dato').length, art = entries.filter(e => e.st === 'artefacto').length;
  const um = n => n === 1 ? '1 umbral' : n + ' umbrales';
  let head;
  if (ups && downs) head = `Tu mapa se reajusta: <b>${um(ups)}</b> ${ups === 1 ? 'sube' : 'suben'} y <b>${downs}</b> ${downs === 1 ? 'baja' : 'bajan'}.`;
  else if (ups) head = `Tu motor subió de marcha: <b>${um(ups)}</b> ${ups === 1 ? 'sube' : 'suben'}.`;
  else if (downs) head = `Tu mapa se ajusta a tu momento: <b>${um(downs)}</b> ${downs === 1 ? 'baja' : 'bajan'}.`;
  else head = 'Tus zonas se mantienen: tu mapa sigue vigente.';

  let h = `<div class="hero"><div class="kicker">Zonas de entrenamiento · ${esc(fdate(D.f))}</div><h1>${esc(name)}</h1><div class="sub">${head}</div>` +
    `<div class="meta">${D.g ? `<span>Grupo <b>${esc(D.g)}</b></span>` : ''}<span>Ventana <b>${esc(WIN.txt.replace(/ \(\d+ d\)$/, ''))}</b> · ${esc(WIN.short)}</span><span class="hint">◆ Toca una zona o un punto para ver sus números</span></div></div>`;

  if (entries.length) {
    const cnt = [];
    if (ups) cnt.push(`<span class="cnt up">▲ ${ups} ${ups === 1 ? 'sube' : 'suben'}</span>`);
    if (downs) cnt.push(`<span class="cnt down">▼ ${downs} ${downs === 1 ? 'baja' : 'bajan'}</span>`);
    if (same) cnt.push(`<span class="cnt flat">= ${same} se ${same === 1 ? 'mantiene' : 'mantienen'}</span>`);
    if (art) cnt.push(`<span class="cnt wrn">⚠ ${art} ${art === 1 ? 'dato descartado' : 'datos descartados'}</span>`);
    const nTP = entries.filter(e => e.changed && e.tp === 'escrito').length, nPr = entries.filter(e => e.changed && e.tp === 'propuesta').length;
    h += `<section id="resumen"><div class="sec-h"><span class="acto">Resumen</span><h2>Tus umbrales en una pantalla</h2></div>` +
      `<div class="counts">${cnt.join('')}</div><div class="tiles">${entries.map(tile).join('')}</div>` +
      `<div class="athlete-note" style="margin-top:14px">Tus zonas son el mapa de tus entrenos. ${ups ? 'Donde subiste, el mapa se estira hacia arriba. ' : ''}Toca una tarjeta para ver sus zonas.</div>` +
      `<div class="coach-note"><span class="tag">Entrenador · resumen</span><span class="mono">Ventana mean-max: <b>${esc(WIN.txt)}</b>. Umbral = media del mejor 20′ crudo (MM20); zonas = fronteras del esquema × k, k = nuevo / anterior.<br>` +
      `Métricas: ${entries.length} · suben ${ups} · bajan ${downs} · iguales/sin dato ${same} · artefactos ${art} · escritas en TP ${nTP} · propuestas ${nPr}.</span></div></section>`;
  } else {
    h += '<div class="callout"><h4>Este enlace no trae zonas para mostrar.</h4></div>';
  }

  sports.forEach(s => {
    const es = entries.filter(e => e.sport === s), S = D.d[s];
    const anyCh = es.some(e => e.changed && e.prev && e.next);
    const curve = curveCard(s, S, es);
    if (!es.length && !curve) return;
    h += `<section id="s-${s}"><div class="sec-h"><span class="acto">${SP[s].acto}</span><h2>Tus zonas de ${SP[s].de}</h2></div>` +
      `<p class="lede">${anyCh ? 'Antes en gris, ahora en color. Toca una zona para ver su rango.' : 'Tus zonas vigentes. Toca una zona para ver su rango.'}</p>` +
      `<div class="grid g2">${es.map((e, i) => metricCard(e, es.length % 2 === 1 && i === es.length - 1)).join('')}${curve}</div></section>`;
  });
  if (D.coz && typeof D.coz === 'object') h += cozSection(D.coz);
  h += methodSection();
  app.innerHTML = h;

  const coach = document.body.classList.contains('coach');
  app.querySelectorAll('details.tv').forEach(d => { d.open = coach; });
  PENDING.forEach(p => { if (p.kind === 'ribbon') mountRibbon(p); else mountCurve(p); });

  const navs = [['resumen', 'Resumen']].concat(sports.filter(s => document.getElementById('s-' + s)).map(s => ['s-' + s, SP[s].acto]));
  if (document.getElementById('coz')) navs.push(['coz', 'Cozumel']);
  navs.push(['metodo', 'Método']);
  navEl.innerHTML = navs.filter(x => document.getElementById(x[0])).map(x => `<button type="button" data-go="${x[0]}">${x[1]}</button>`).join('');
  footMeta.textContent = 'Zonas · ' + name + ' · ventana ' + WIN.txt + (ymd(D.f) ? ' · generado ' + fdate(D.f) : '');
}

function mountRibbon(p) {
  const e = p.e, host = document.getElementById('v-' + e.id), leg = document.getElementById('l-' + e.id), out = document.getElementById('o-' + e.id);
  if (!host) return;
  const main = p.main, tMain = p.tMain, n = main.length;
  let sel = 0; main.forEach((z, i) => { if (tMain > 0 && z[0] <= tMain) sel = i; });
  const labB = p.both ? (e.tp === 'propuesta' ? 'PROPUESTA' : 'AHORA') : (e.changed ? 'AHORA' : 'SE MANTIENEN');
  const R = Ribbon(host, { sport: e.sport, met: e.met, A: p.both ? e.prev : null, B: main, tA: p.both ? e.tP : NaN, tB: tMain, names: p.names, labA: 'ANTES', labB, sel,
    aria: `Zonas de ${MT[e.met].name.toLowerCase()} de ${SP[e.sport].de}` + (p.both ? `: antes umbral ${fvs(e.sport, e.met, e.tP)}, ahora ${fvs(e.sport, e.met, e.tN)}` : '') });
  const colors = ramp(e.sport, n);
  leg.innerHTML = p.names.map((nm, i) => `<button type="button" data-i="${i}" aria-label="Zona ${esc(nm)}"><i style="background:${colors[i].c}"></i>${esc(nm)}</button>`).join('');
  const readout = i => {
    const z = main[i], pz = p.both ? e.prev[i] : null, pace = isPace(e.sport, e.met);
    const nw = t => `<span class="nw">${esc(t)}</span>`;
    let s = `<b>${esc(p.names[i])}</b> · `;
    if (p.both) s += `${labB === 'PROPUESTA' ? 'propuesta' : 'ahora'} <b>${nw(zr(e.sport, e.met, z, i, n, tMain))}</b>` + (pz ? ` · antes ${nw(zr(e.sport, e.met, pz, i, e.prev.length, e.tP))}` : '');
    else s += `<b>${nw(zr(e.sport, e.met, z, i, n, tMain))}</b>`;
    s += `<span class="coach-only"> · ${nw(zpct(e.met, z, i, n, tMain))} del umbral${e.met === 'sp' ? ' · ' + nw(zms(e.met, z, i, n, tMain)) : ''}</span>`;
    return s;
  };
  const sync = i => { [...leg.children].forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-pressed', j === i ? 'true' : 'false'); }); out.innerHTML = readout(i); };
  R.onSel = sync;
  leg.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; const i = +b.dataset.i; R.sel = i; R.draw(); sync(i); });
  leg.addEventListener('focusin', ev => { const b = ev.target.closest('button'); if (!b) return; const i = +b.dataset.i; if (i !== R.sel) { R.sel = i; R.draw(); sync(i); } });
  R.draw(); sync(sel);
}

function mountCurve(p) {
  const host = document.getElementById('v-' + p.id), out = document.getElementById('o-' + p.id); if (!host) return;
  const e = p.e;
  const C = Curve(host, { sport: p.sport, met: p.met, pts: p.pts, st: e ? e.st : '', tN: e ? e.tN : NaN, tP: e ? e.tP : NaN, showNew: p.showNew,
    aria: `Curva de rendimiento de ${SP[p.sport].de}, ${MT[p.met].name.toLowerCase()}, ${p.pts.length} duraciones` });
  const readout = i => {
    const q = p.pts[i], v = fv(p.sport, p.met, q[1]);
    return `<b>${esc(v.v)} ${esc(v.u)}</b> · mejor marca en ${esc(durLab(q[0]))} · ${esc(fdate(q[2]))}` +
      `<span class="coach-only"> · t = ${esc(nf(q[0]))} s${p.met === 'sp' ? ' · v = ' + esc(nf(q[1], 2)) + ' m/s' : ''}</span>`;
  };
  C.onSel = i => { out.innerHTML = readout(i); };
  C.block = host.closest('.cblk');
  C.draw(); out.innerHTML = readout(C.sel);
}

/* ---------- mensajes de enlace incompleto ---------- */
function showMsg(err) {
  CHARTS.length = 0; navEl.innerHTML = ''; footMeta.textContent = '';
  document.title = 'Enlace incompleto · Made For Try';
  app.innerHTML = `<div class="hero"><div class="kicker">Zonas de entrenamiento</div><h1>Enlace incompleto</h1>` +
    `<div class="sub">No pudimos abrir tus zonas con este enlace.</div></div>` +
    `<div class="callout danger"><h4>Enlace incompleto: pide a tu entrenador que te lo reenvíe.</h4>` +
    `<p class="note-s">Suele pasar cuando el mensaje corta el enlace o falta la parte final (después de <span class="mono">#z=</span>).</p></div>` +
    `<div class="coach-note"><span class="tag">Entrenador · diagnóstico</span><span class="mono">${esc(err ? String(err.message || err) : 'el enlace no trae el fragmento #z=')}</span></div>`;
}

/* ---------- arranque ---------- */
let lastZ = null;
async function boot() {
  const z = getZ(); lastZ = z;
  if (!z) { showMsg(null); return; }
  let data;
  try { data = await decodeZ(z); } catch (err) { showMsg(err); return; }
  try { render(data); } catch (err) { showMsg(err); }
}
window.addEventListener('hashchange', () => { const z = getZ(); if (z && z !== lastZ) boot(); });

/* navegación interna sin tocar el fragmento (el fragmento lleva los datos) */
document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]'); if (!g) return;
  const el = document.getElementById(g.dataset.go); if (!el) return;
  ev.preventDefault();
  const hh = document.querySelector('header').offsetHeight;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - hh - 10, behavior: reduce ? 'auto' : 'smooth' });
});
/* selector de métrica de la curva */
app.addEventListener('click', ev => {
  const b = ev.target.closest('.seg button'); if (!b) return;
  const seg = b.parentElement, card = seg.closest('.card');
  [...seg.children].forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  card.querySelectorAll('.cblk').forEach(bl => { bl.hidden = bl.dataset.k !== b.dataset.k; });
  CHARTS.forEach(c => { if (c.block && !c.block.hidden) c.draw(); });
});
/* redibujar a la medida real del contenedor (texto SVG siempre a su tamaño real) */
let lastW = 0, rq = 0;
window.addEventListener('resize', () => {
  if (rq) return;
  rq = requestAnimationFrame(() => { rq = 0; const w = document.documentElement.clientWidth; if (w === lastW) return; lastW = w; CHARTS.forEach(c => c.draw()); });
});
lastW = document.documentElement.clientWidth;
boot();
})();
</script>
</body>
</html>
